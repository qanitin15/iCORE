<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>iCORE App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .gradient-text {
            background: linear-gradient(90deg, #f43f5e, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-btn {
            background-image: linear-gradient(to right, #f43f5e 0%, #a855f7 51%, #f43f5e 100%);
            background-size: 200% auto;
            transition: all 0.5s;
        }

        .gradient-btn:hover {
            background-position: right center;
            box-shadow: 0 10px 20px -5px rgba(236, 72, 153, 0.4);
        }

        .gradient-border {
            border: 2px solid;
            border-image-slice: 1;
            border-image-source: linear-gradient(to bottom right, #f43f5e, #a855f7);
        }

        #splash-screen,
        .app-page,
        .modal-backdrop,
        .modal-content {
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #d8b4fe;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #f472b6;
        }

        .card-hover-effect:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px -5px rgba(236, 72, 153, 0.15);
        }

        .heart-btn.liked svg {
            fill: #f43f5e;
            stroke: #f43f5e;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.05);
            }
        }

        .animate-pulse-logo {
            animation: pulse 2.5s infinite ease-in-out;
        }

        .bottom-nav button.active {
            color: #a855f7;
            font-weight: 600;
        }

        .bottom-nav button.active .nav-icon {
            transform: scale(1.1);
            background: linear-gradient(to top, #f5d0fe, #fbcfe8);
            border-radius: 9999px;
            padding: 4px;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-pop {
            animation: pop 0.3s ease-out;
        }

        #toast {
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #login {
            font-family: 'Inter', sans-serif;
        }

        .gradient-text {
            background: linear-gradient(90deg, #f43f5e, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-btn {
            background-image: linear-gradient(to right, #f43f5e 0%, #a855f7 51%, #f43f5e 100%);
            background-size: 200% auto;
            transition: all 0.5s;
        }

        .gradient-btn:hover {
            background-position: right center;
            box-shadow: 0 10px 20px -5px rgba(236, 72, 153, 0.4);
        }

        .gradient-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>

<body id="login" class="antialiased text-gray-800">
    <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div>
                <h1 class="text-center text-6xl font-extrabold tracking-tight gradient-text">iCORE</h1>
                <h2 class="mt-4 text-center text-2xl font-bold text-gray-900">
                    Sign in to your account
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Or
                    <a href="#" class="font-medium text-purple-600 hover:text-purple-500">
                        start your 14-day free trial
                    </a>
                </p>
            </div>

            <form id="login-form" class="mt-8 space-y-6 bg-white p-8 shadow-xl rounded-2xl">
                <div class="rounded-md shadow-sm -space-y-px">
                    <div>
                        <label for="email-address" class="sr-only">Email address</label>
                        <input id="email-address" name="email" type="email" autocomplete="email" required
                            class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-purple-500 focus:border-purple-500 focus:z-10 sm:text-sm"
                            placeholder="Email address">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-purple-500 focus:border-purple-500 focus:z-10 sm:text-sm"
                            placeholder="Password">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                            Remember me
                        </label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-purple-600 hover:text-purple-500">
                            Forgot your password?
                        </a>
                    </div>
                </div>

                <div>
                    <button id="login-button" type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-md text-white gradient-btn focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i data-lucide="lock" class="h-5 w-5 text-purple-300 group-hover:text-purple-200"
                                aria-hidden="true"></i>
                        </span>
                        Sign In
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const loginForm = document.getElementById('login-form');
            const loginButton = document.getElementById('login-button');
            const originalButtonText = loginButton.innerHTML;

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault(); // Prevent the form from actually submitting and reloading the page

                // Get form values (in a real app, you'd send these to a server)
                const email = document.getElementById('email-address').value;
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    alert('Please fill in both email and password.');
                    return;
                }

                // --- Simulate a login process ---

                // 1. Show a loading state on the button
                loginButton.disabled = true;
                loginButton.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Signing In...
                `;

                // 2. Wait for 1.5 seconds to simulate a network request
                setTimeout(() => {
                    // 3. On success, show an alert and redirect
                    // NOTE: In a real app, this redirect would happen only after
                    // your server confirms the login was successful.
                    alert('Login successful! Welcome back.');

                    // Assuming your main app file is named 'app.html'
                    window.location.href = './app.html';
                }, 1500);
            });
        });
    </script>
    <div id="splash-screen"

        <h1 class="text-7xl font-extrabold tracking-tight animate-pulse-logo gradient-text">iCORE</h1>
        <p class="mt-4 text-gray-500">Your Ultimate Thrift & Style Companion</p>
    </div>

    <div id="main-app" class="hidden max-w-md mx-auto bg-white shadow-2xl min-h-screen pb-20 sm:max-w-xl md:max-w-2xl">

                <h1 id="page-title" class="text-xl font-bold text-gray-800">Home</h1>

        <main class="relative">
            <div id="home-page" class="app-page p-4 space-y-8">
            </div>

            <div id="wishlist-page" class="app-page hidden p-4">
                <div id="wishlist-items" class="space-y-4"></div>
            </div>

            <div id="sell-page" class="app-page hidden p-4">
                <form id="sell-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
                        <div id="image-preview-container"

                                class="absolute top-2 right-2 bg-black/50 text-white rounded-full p-1 leading-none">&times;</button>
                        </div>
                        <div id="image-upload-box"
                            class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md cursor-pointer hover:border-purple-400">
                            <div class="space-y-1 text-center">
                                <i data-lucide="image-plus" class="mx-auto h-12 w-12 text-gray-400"></i>
                                <div class="flex text-sm text-gray-600">
                                    <label for="file-upload"
                                        class="relative cursor-pointer bg-white rounded-md font-medium text-purple-600 hover:text-purple-500">
                                        <span>Upload a file</span>
                                        <input id="file-upload" name="file-upload" type="file" class="sr-only"

                                </div>
                                <p class="text-xs text-gray-500">PNG, JPG up to 10MB</p>
                            </div>

                    <div><label for="sell-title" class="text-sm font-medium text-gray-700">Title</label><input

                            required></div>
                    <div><label for="sell-desc" class="text-sm font-medium text-gray-700">Description</label><textarea
                            id="sell-desc" rows="3" placeholder="Describe the condition, size, material..."

                            required></textarea></div>
                    <div><label for="sell-price" class="text-sm font-medium text-gray-700">Price (₹)</label><input
                            id="sell-price" type="number" placeholder="499"

                    <div><label for="sell-cat" class="text-sm font-medium text-gray-700">Category</label><select
                            id="sell-cat"

                            required>
                            <option>Tops</option>
                            <option>Dresses</option>
                            <option>Shoes</option>
                            <option>Accessories</option>
                        </select></div>
                    <button type="submit"

                        Item</button>
                </form>
            </div>

            <div id="account-page" class="app-page hidden p-4">
                <div class="flex flex-col items-center text-center">
                    <img src="https://i.pravatar.cc/150?u=sanskriti" alt="User Avatar"

                    <h2 class="text-2xl font-bold mt-3">Sanskriti</h2>
                    <p class="text-sm text-gray-500">sanskriti@example.com</p>

                <div class="grid grid-cols-3 gap-4 text-center my-8">

                <div class="space-y-3">

                                class="w-6 h-6 text-gray-500"></i><span class="font-semibold">Settings</span></div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>

                <div class="mt-8">
                    <button onclick="alert('You have been logged out.')"

        </main>

        <footer
            class="fixed bottom-0 left-0 right-0 max-w-md mx-auto sm:max-w-xl md:max-w-2xl bg-white border-t border-gray-200 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
            <div class="bottom-nav flex justify-around">
                <button data-page="home-page"
                    class="nav-btn active flex-1 flex flex-col items-center justify-center pt-2 pb-1 text-gray-500 transition-colors">
                    <span class="nav-icon"><i data-lucide="home" class="w-6 h-6"></i></span><span
                        class="text-xs mt-1">Home</span>
                </button>
                <button data-page="wishlist-page"
                    class="nav-btn flex-1 flex flex-col items-center justify-center pt-2 pb-1 text-gray-500 transition-colors">
                    <span class="nav-icon"><i data-lucide="heart" class="w-6 h-6"></i></span><span
                        class="text-xs mt-1">Wishlist</span>
                </button>
                <button data-page="sell-page"
                    class="nav-btn flex-1 flex flex-col items-center justify-center pt-2 pb-1 text-gray-500 transition-colors">
                    <span class="nav-icon"><i data-lucide="plus-circle" class="w-6 h-6"></i></span><span
                        class="text-xs mt-1">Sell</span>

                <button data-page="account-page"
                    class="nav-btn flex-1 flex flex-col items-center justify-center pt-2 pb-1 text-gray-500 transition-colors">

    </div>

    <div id="modal" class="fixed inset-0 items-center justify-center hidden z-50">
        <div class="modal-backdrop fixed inset-0"></div>
        <div
            class="modal-content bg-white rounded-lg shadow-xl w-11/12 max-w-md m-4 relative transform opacity-0 -translate-y-10 overflow-y-auto max-h-[90vh]">
        </div>
    </div>

    <div id="toast"
        class="fixed bottom-24 right-4 bg-gray-800 text-white py-2 px-5 rounded-lg shadow-xl transform translate-x-[calc(100%+2rem)]">
        <p id="toast-message"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- State Management ---
            let userWishlist = new Set(JSON.parse(localStorage.getItem('iCORE_wishlist')) || [2]);
            let userCart = new Set();
            let userProducts = [];
            const products = [
                { id: 1, title: 'Vintage Floral Dress', price: 799, category: 'Dresses', image: 'https://images.unsplash.com/photo-1579369353590-7745c43a3b58?q=80&w=400', description: 'Beautiful vintage dress from the 90s. Perfect condition, fits size M.' },
                { id: 2, title: 'Classic Leather Jacket', price: 1499, category: 'Tops', image: 'https://images.unsplash.com/photo-1579369353590-7745c43a3b58?q=80&w=400', description: 'Timeless leather jacket. Barely worn. A staple for any wardrobe.' },
                { id: 3, title: 'High-Waisted Jeans', price: 450, category: 'Tops', image: 'https://images.unsplash.com/photo-1604176354204-926873782855?q=80&w=400', description: 'Comfy and stylish high-waisted mom jeans. Size 28.' },
                { id: 4, title: 'White Canvas Sneakers', price: 699, category: 'Shoes', image: 'https://images.unsplash.com/photo-1579369353590-7745c43a3b58?q=80&w=400', description: 'Goes with everything! Classic white sneakers in great condition. Size 7.' },
                { id: 5, title: 'Summer Knit Top', price: 299, category: 'Tops', image: 'https://images.unsplash.com/photo-1554424349-8eac3c38f172?q=80&w=400', description: 'Light and airy knit top, perfect for summer evenings.' },
                { id: 6, title: 'Pleated Pink Skirt', price: 349, category: 'Dresses', image: 'https://images.unsplash.com/photo-1591047139829-d919b5ca23d2?q=80&w=400', description: 'Fun and flirty pleated skirt. Excellent condition.' },
            ];

            // --- Initial Setup and DOM elements ---
            const splashScreen = document.getElementById('splash-screen');
            const mainApp = document.getElementById('main-app');
            const pageTitle = document.getElementById('page-title');
            const navButtons = document.querySelectorAll('.nav-btn');
            const modal = document.getElementById('modal');
            const modalContent = modal.querySelector('.modal-content');
            let currentPage = 'home-page';
            let toastTimeout;

            setTimeout(() => {
                splashScreen.style.opacity = '0';
                splashScreen.addEventListener('transitionend', () => splashScreen.classList.add('hidden'));
                mainApp.classList.remove('hidden');
            }, 2000);
            lucide.createIcons();

            // --- Page Navigation ---
            navButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetPageId = button.dataset.page;
                    if (targetPageId === currentPage) return;
                    navButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    lucide.createIcons();
                    const title = targetPageId.split('-')[0];
                    pageTitle.textContent = title.charAt(0).toUpperCase() + title.slice(1);
                    if (targetPageId === 'wishlist-page') renderWishlistPage();
                    if (targetPageId === 'account-page') renderAccountPage();
                    const currentPageEl = document.getElementById(currentPage);
                    const targetPage = document.getElementById(targetPageId);
                    currentPageEl.style.opacity = '0';
                    setTimeout(() => {
                        document.querySelectorAll('.app-page').forEach(p => p.classList.add('hidden'));
                        targetPage.classList.remove('hidden');
                        setTimeout(() => targetPage.style.opacity = '1', 10);
                    }, 150);
                    currentPage = targetPageId;
                });
            });

            // --- Rendering Functions ---
            const renderProducts = (productsToRender, containerId) => {
                const grid = document.getElementById(containerId);
                if (!grid) return;
                grid.innerHTML = '';
                productsToRender.forEach(product => {
                    const isLiked = userWishlist.has(product.id);
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-lg overflow-hidden border border-gray-100 shadow-sm transition-all duration-300 card-hover-effect flex flex-col';
                    card.innerHTML = `
                <div class="relative group">
                    <img src="${product.image}" alt="${product.title}" class="w-full h-48 object-cover cursor-pointer" onclick="openModal('product', ${product.id})">
                    <button data-product-id="${product.id}" class="heart-btn ${isLiked ? 'liked' : ''} absolute top-2 right-2 bg-white/70 backdrop-blur-sm p-1.5 rounded-full text-gray-700 hover:text-rose-500 transition-all duration-300">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    </button>
                </div>
                <div class="p-3 flex-grow flex flex-col cursor-pointer" onclick="openModal('product', ${product.id})">
                    <h3 class="font-semibold text-sm truncate">${product.title}</h3>
                    <p class="font-bold mt-1 text-gray-800">₹${product.price.toLocaleString('en-IN')}</p>
                </div>`;
                    grid.appendChild(card);
                });
            };

            const renderHomePage = () => {
                const homePageContainer = document.getElementById('home-page');
                if (homePageContainer.innerHTML.trim() === '') {
                    homePageContainer.innerHTML = `
                <div><p class="text-2xl font-bold">Hello, Sanskriti!</p><p class="text-gray-500">Let's find your next favorite piece.</p></div>
                <div><h2 class="text-lg font-bold text-gray-800 mb-2">Deal of the Day</h2><div id="featured-item" class="bg-gradient-to-br from-rose-100 to-purple-100 rounded-xl p-4 flex items-center gap-4 card-hover-effect"></div></div>
                <div><h2 class="text-lg font-bold text-gray-800 mb-3">Popular Categories</h2><div class="flex gap-4 overflow-x-auto pb-2 -mx-4 px-4"><button class="flex flex-col items-center justify-center flex-shrink-0 w-20 h-20 bg-white rounded-xl shadow-md hover:bg-gray-50 transition"><i data-lucide="shirt" class="w-8 h-8 text-rose-500"></i><span class="text-xs mt-1 font-medium">Tops</span></button><button class="flex flex-col items-center justify-center flex-shrink-0 w-20 h-20 bg-white rounded-xl shadow-md hover:bg-gray-50 transition"><i data-lucide="gem" class="w-8 h-8 text-purple-500"></i><span class="text-xs mt-1 font-medium">Dresses</span></button><button class="flex flex-col items-center justify-center flex-shrink-0 w-20 h-20 bg-white rounded-xl shadow-md hover:bg-gray-50 transition"><i data-lucide="footprints" class="w-8 h-8 text-rose-500"></i><span class="text-xs mt-1 font-medium">Shoes</span></button><button class="flex flex-col items-center justify-center flex-shrink-0 w-20 h-20 bg-white rounded-xl shadow-md hover:bg-gray-50 transition"><i data-lucide="hand" class="w-8 h-8 text-purple-500"></i><span class="text-xs mt-1 font-medium">Accessories</span></button></div></div>
                <div><h2 class="text-lg font-bold text-gray-800 mb-3">Just For You</h2><div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div></div>`;
                    lucide.createIcons();
                }
                const featuredContainer = document.getElementById('featured-item');
                const featuredProduct = products.find(p => p.id === 2);
                if (featuredProduct && featuredContainer) {
                    featuredContainer.innerHTML = `<img src="${featuredProduct.image}" class="w-24 h-24 object-cover rounded-lg shadow-lg"><div class="flex-1"><h3 class="font-bold text-gray-800">${featuredProduct.title}</h3><p class="text-sm text-gray-600">Now only at <span class="font-extrabold text-rose-500 text-lg">₹${featuredProduct.price.toLocaleString('en-IN')}</span></p><button onclick="openModal('product', ${featuredProduct.id})" class="text-xs font-semibold text-purple-600 mt-1">Shop Now &rarr;</button></div>`;
                }
                renderProducts(products, 'product-grid');
            };

            const renderWishlistPage = () => {
                const container = document.getElementById('wishlist-items');
                const wishlistProducts = products.filter(p => userWishlist.has(p.id));
                if (wishlistProducts.length > 0) {
                    container.innerHTML = wishlistProducts.map(p => {
                        const isInCart = userCart.has(p.id);
                        return `<div class="bg-white p-3 rounded-lg shadow-md flex items-center gap-4"><img src="${p.image}" class="w-20 h-20 rounded-md object-cover"><div class="flex-grow"><p class="font-semibold">${p.title}</p><p class="text-sm text-gray-700 font-bold">₹${p.price.toLocaleString('en-IN')}</p></div><div class="flex flex-col gap-2"><button onclick="toggleWishlist(${p.id}, true)" class="p-2 rounded-full bg-rose-100 text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button><button onclick="addToCartFromWishlist(${p.id})" class="p-2 rounded-full ${isInCart ? 'bg-gray-200 text-gray-500' : 'bg-purple-100 text-purple-600'}" ${isInCart ? 'disabled' : ''}><i data-lucide="${isInCart ? 'check' : 'shopping-cart'}" class="w-4 h-4"></i></button></div></div>`;
                    }).join('');
                } else {
                    container.innerHTML = `<div class="text-center py-16 px-4"><div class="mx-auto w-24 h-24 bg-rose-100 rounded-full flex items-center justify-center"><i data-lucide="heart-crack" class="w-12 h-12 text-rose-400"></i></div><h3 class="text-xl font-bold mt-4">Your Wishlist is Empty</h3><p class="text-gray-500 mt-2 mb-6">Looks like you haven't liked anything yet. Let's change that!</p><button id="discover-btn" class="gradient-btn text-white font-semibold py-2 px-6 rounded-lg">Discover Items</button></div>`;
                    document.getElementById('discover-btn').addEventListener('click', () => {
                        document.querySelector('.nav-btn[data-page="home-page"]').click();
                    });
                }
                lucide.createIcons();
            };

            const renderAccountPage = () => {
                const listingsCountEl = document.getElementById('active-listings-count');
                if (listingsCountEl) listingsCountEl.textContent = userProducts.length;
            };

            // --- Modal System ---
            const closeModal = () => {
                modal.classList.add('opacity-0');
                modalContent.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => { modal.classList.add('hidden'); modalContent.innerHTML = ''; }, 300);
            };
            window.closeModal = closeModal;

            const modalContentGenerators = {
                product: (id) => {
                    const product = products.find(p => p.id === id);
                    const isInCart = userCart.has(id);
                    return `<button onclick="closeModal()" class="absolute top-2 right-2 p-1 rounded-full hover:bg-gray-100 z-10">&times;</button><img src="${product.image}" alt="${product.title}" class="w-full h-64 object-cover rounded-t-lg"><div class="p-5"><h2 class="text-2xl font-bold">${product.title}</h2><p class="text-xl font-semibold text-gray-800 mt-1">₹${product.price.toLocaleString('en-IN')}</p><p class="text-gray-600 text-sm mt-4">${product.description}</p><button onclick="addToCart(${id})" class="w-full mt-5 gradient-btn text-white py-3 rounded-lg font-semibold flex items-center justify-center space-x-2 ${isInCart ? 'opacity-70 cursor-not-allowed' : ''}" ${isInCart ? 'disabled' : ''}><i data-lucide="${isInCart ? 'check-circle' : 'shopping-cart'}" class="w-5 h-5"></i><span>${isInCart ? 'Added to Cart' : 'Add to Cart'}</span></button></div>`;
                },
                cart: () => {
                    const cartProducts = products.filter(p => userCart.has(p.id));
                    const subtotal = cartProducts.reduce((acc, p) => acc + p.price, 0);
                    const itemsHtml = cartProducts.length > 0 ? cartProducts.map(p => `<div class="flex items-center justify-between p-2 rounded-md"><div class="flex items-center space-x-3"><img src="${p.image}" class="w-16 h-16 rounded-md object-cover"><div><p class="font-semibold">${p.title}</p><p class="text-sm text-gray-600">₹${p.price.toLocaleString('en-IN')}</p></div></div><button onclick="removeFromCart(${p.id})" class="p-1.5 rounded-full hover:bg-rose-100 text-gray-500 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('') : '<p class="text-center text-gray-500 py-4">Your cart is empty.</p>';
                    return `<div class="p-5"><div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">Shopping Cart</h2><button onclick="closeModal()" class="p-1 rounded-full hover:bg-gray-100">&times;</button></div><div class="space-y-2 max-h-64 overflow-y-auto pr-2">${itemsHtml}</div>${cartProducts.length > 0 ? `<div class="mt-5 pt-5 border-t"><div class="flex justify-between font-semibold"><p>Subtotal</p><p>₹${subtotal.toLocaleString('en-IN')}</p></div><button class="w-full mt-4 gradient-btn text-white py-3 rounded-lg font-semibold">Proceed to Checkout</button></div>` : ''}</div>`;
                },
                userListings: () => {
                    const itemsHtml = userProducts.length > 0 ? userProducts.map(p => `<div class="flex items-center justify-between p-2 rounded-md hover:bg-gray-50"><div class="flex items-center space-x-3"><img src="${p.image}" class="w-16 h-16 rounded-md object-cover"><div><p class="font-semibold">${p.title}</p><p class="text-sm text-gray-600">₹${p.price.toLocaleString('en-IN')}</p></div></div><button onclick="showToast('Feature coming soon!')" class="p-1.5 rounded-full text-gray-500 hover:bg-gray-200"><i data-lucide="more-vertical" class="w-4 h-4"></i></button></div>`).join('') : '<p class="text-center text-gray-500 py-4">You haven\'t listed any items yet.</p>';
                    return `<div class="p-5"><div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">Your Listings</h2><button onclick="closeModal()" class="p-1 rounded-full hover:bg-gray-100">&times;</button></div><div class="space-y-2 max-h-80 overflow-y-auto pr-2">${itemsHtml}</div></div>`;
                }
            };

            window.openModal = (type, ...args) => {
                modalContent.innerHTML = modalContentGenerators[type](...args);
                modal.classList.remove('hidden', 'opacity-0'); modal.classList.add('flex');
                setTimeout(() => modalContent.classList.remove('opacity-0', '-translate-y-10'), 10);
                lucide.createIcons();
            };

            // --- Core Logic ---
            window.showToast = (message) => {
                const toast = document.getElementById('toast');
                const toastMessage = document.getElementById('toast-message');
                toastMessage.textContent = message;
                toast.classList.remove('translate-x-[calc(100%+2rem)]');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.add('translate-x-[calc(100%+2rem)]');
                }, 3000);
            };

            const saveWishlist = () => {
                localStorage.setItem('iCORE_wishlist', JSON.stringify(Array.from(userWishlist)));
            };

            const updateCartBadge = () => {
                const badge = document.getElementById('cart-badge');
                badge.textContent = userCart.size;
                badge.classList.toggle('hidden', userCart.size === 0);
                badge.classList.add('animate-pop');
                badge.addEventListener('animationend', () => badge.classList.remove('animate-pop'), { once: true });
            };

            window.addToCart = (productId) => {
                if (userCart.has(productId)) return;
                userCart.add(productId);
                updateCartBadge();
                showToast("Added to Cart!");
                closeModal();
                openModal('product', productId);
            };

            window.addToCartFromWishlist = (productId) => {
                if (userCart.has(productId)) return;
                userCart.add(productId);
                updateCartBadge();
                showToast("Added to Cart!");
                renderWishlistPage();
            };

            window.removeFromCart = (productId) => {
                userCart.delete(productId);
                updateCartBadge();
                openModal('cart');
            };

            window.toggleWishlist = (productId, fromWishlistPage = false) => {
                const heartButton = document.querySelector(`.heart-btn[data-product-id="${productId}"]`);
                if (userWishlist.has(productId)) {
                    userWishlist.delete(productId);
                    if (heartButton) heartButton.classList.remove('liked');
                    showToast("Removed from Wishlist!");
                } else {
                    userWishlist.add(productId);
                    if (heartButton) heartButton.classList.add('liked');
                    showToast("Added to Wishlist!");
                }
                saveWishlist();
                if (fromWishlistPage) renderWishlistPage();
            };

            // --- Event Listeners ---
            document.getElementById('cart-button').addEventListener('click', () => openModal('cart'));
            document.body.addEventListener('click', (e) => {
                const heartBtn = e.target.closest('.heart-btn');
                if (heartBtn) {
                    toggleWishlist(parseInt(heartBtn.dataset.productId));
                }
            });

            // --- Sell Page Logic ---
            const sellForm = document.getElementById('sell-form');
            const fileInput = document.getElementById('file-upload');
            const imagePreviewContainer = document.getElementById('image-preview-container');
            const imagePreview = document.getElementById('image-preview');
            const imageUploadBox = document.getElementById('image-upload-box');
            const removeImageBtn = document.getElementById('remove-image-btn');
            let uploadedImageUrl = null;
            imageUploadBox.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        uploadedImageUrl = event.target.result;
                        imagePreview.src = uploadedImageUrl;
                        imagePreviewContainer.classList.remove('hidden');
                        imageUploadBox.classList.add('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });
            const resetImageUpload = () => {
                fileInput.value = '';
                imagePreview.src = '';
                uploadedImageUrl = null;
                imagePreviewContainer.classList.add('hidden');
                imageUploadBox.classList.remove('hidden');
            }
            removeImageBtn.addEventListener('click', resetImageUpload);
            sellForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const newProduct = {
                    id: Date.now(),
                    title: document.getElementById('sell-title').value,
                    price: parseFloat(document.getElementById('sell-price').value),
                    category: document.getElementById('sell-cat').value,
                    image: uploadedImageUrl || 'https://placehold.co/400x400/fecdd3/f43f5e?text=iCORE',
                    description: document.getElementById('sell-desc').value
                };
                products.unshift(newProduct);
                userProducts.unshift(newProduct);
                renderHomePage();
                showToast('Item listed successfully!');
                sellForm.reset();
                resetImageUpload();
                document.querySelector('.nav-btn[data-page="home-page"]').click();
            });

            // --- Initial Render ---
            renderHomePage();
        });
    </script>

</body>

</html>
