<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>iCORE — Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* small enhancement for the gradient button focus */
        .gradient-btn {
            background-image: linear-gradient(90deg, #f43f5e, #a855f7);
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-rose-50 via-purple-50 to-white flex items-center justify-center">
    <div class="max-w-3xl w-full px-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
            <!-- Left: marketing / brand -->
            <div class="hidden md:flex flex-col justify-center bg-white/60 rounded-2xl p-8 shadow-lg">
                <h1 class="text-5xl font-extrabold gradient-text">iCORE</h1>
                <p class="mt-4 text-gray-600">Thrift. Style. Community. Sell and discover great finds nearby.</p>
                <ul class="mt-6 space-y-2 text-sm text-gray-700">
                    <li>• Curated secondhand fashion</li>
                    <li>• Easy listings with photos</li>
                    <li>• Built-in wishlist and cart</li>
                </ul>
            </div>

            <!-- Right: login card -->
            <div class="bg-white p-8 rounded-2xl shadow-xl">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold">Welcome back</h2>
                        <p class="text-sm text-gray-500">Sign in to continue to iCORE</p>
                    </div>
                    <img src="/logo.jpg.jpg" alt="iCORE logo" class="w-12 h-12 rounded-full object-cover">
                </div>

                <form id="login-form" class="mt-6 space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input id="email" type="email" autocomplete="email" required
                            class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-3 focus:ring-2 focus:ring-purple-300" />
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="relative mt-1">
                            <input id="password" type="password" autocomplete="current-password" required
                                class="block w-full rounded-md border-gray-200 shadow-sm p-3 pr-12 focus:ring-2 focus:ring-purple-300" />
                            <button id="toggle-password" type="button"
                                class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="inline-flex items-center text-sm">
                            <input id="remember" type="checkbox" class="form-checkbox h-4 w-4 text-purple-600" />
                            <span class="ml-2 text-gray-600">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-purple-600">Forgot password?</a>
                    </div>

                    <div>
                        <button id="submit" type="submit"
                            class="w-full gradient-btn text-white font-semibold py-3 rounded-lg shadow">
                            <span id="submit-text">Sign in</span>
                            <svg id="submit-spinner" class="hidden animate-spin inline-block ml-2 h-5 w-5"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                        </button>
                    </div>
                </form>

                <p id="message" class="mt-4 text-sm text-red-600 min-h-[1.2rem]"></p>
                <p class="mt-4 text-sm text-gray-600">Don't have an account? <a href="/register"
                        class="text-purple-600 font-medium">Create one</a></p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submit');
        const submitText = document.getElementById('submit-text');
        const spinner = document.getElementById('submit-spinner');
        const togglePw = document.getElementById('toggle-password');
        const pwInput = document.getElementById('password');
        document.getElementById('email').setAttribute('autofocus', 'autofocus');

        togglePw.addEventListener('click', () => {
            if (pwInput.type === 'password') { pwInput.type = 'text'; togglePw.textContent = 'Hide'; }
            else { pwInput.type = 'password'; togglePw.textContent = 'Show'; }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageEl.textContent = '';
            submitBtn.disabled = true;
            spinner.classList.remove('hidden');

            const email = document.getElementById('email').value.trim();
            const password = pwInput.value;

            if (!email || !password) {
                messageEl.textContent = 'Please provide both email and password.';
                submitBtn.disabled = false;
                spinner.classList.add('hidden');
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // ensure cookies/sessions are sent/accepted
                    body: JSON.stringify({ email, password })
                });

                // tolerant parsing: try JSON, fall back to text
                let data;
                try { data = await res.json(); } catch (err) { data = { message: await res.text() }; }

                if (res.ok) {
                    // backend may return redirect url or just success — prefer returned path
                    const redirectTo = (data && data.redirect) ? data.redirect : '/app';
                    window.location.href = redirectTo;
                } else {
                    messageEl.textContent = data && data.message ? data.message : `Login failed (${res.status})`;
                }
            } catch (err) {
                // network-level error
                messageEl.textContent = 'Network error — please try again. ' + (err && err.message ? err.message : '');
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
